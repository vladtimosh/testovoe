<h2>{{ isEditMode ? 'Edit Book' : 'Add Book' }}</h2>
<form (ngSubmit)="onSubmit()">
  <div>
    <label for="title">Title:</label>
    <input type="text" id="title" [(ngModel)]="book.title" name="title" required />
  </div>
  <div>
    <label for="publishedDate">Published Date:</label>
    <input type="date" id="publishedDate" [(ngModel)]="book.publishedDate" name="publishedDate" required />
  </div>
  <div>
    <label for="genre">Genre:</label>
    <input type="text" id="genre" [(ngModel)]="book.genre.genreName" name="genre" required />
  </div>
  <div>
    <label for="authors">Authors:</label>
    <input type="text" id="authors" [(ngModel)]="book.authors" name="authors" required />
  </div>
  <button type="submit">{{ isEditMode ? 'Update' : 'Create' }}</button>
</form>
<a routerLink="/books">Cancel</a>
